name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Manifests and skill frontmatter
        run: |
          pip install --quiet pyyaml
          python .github/check.py

      - name: Shell scripts
        run: |
          for f in skills/*/scripts/*.sh; do bash -n "$f"; done
          shellcheck -S warning skills/*/scripts/*.sh
