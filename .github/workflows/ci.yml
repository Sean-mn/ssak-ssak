name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its older run; pushes to main always run to the end
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Manifests and skill frontmatter
        run: |
          pip install --quiet pyyaml
          python .github/check.py

      - name: Shell scripts
        run: |
          for f in skills/*/scripts/*.sh tests/*.sh .github/*.sh; do bash -n "$f"; done
          shellcheck -S warning -x skills/*/scripts/*.sh tests/*.sh .github/*.sh

  # Bugs so far were OS-specific: Git Bash on Windows mangles backslashes, macOS ships bash 3.2
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Script tests
        env:
          GH_TOKEN: ${{ github.token }}  # the claim regex test runs through gh's jq
        run: |
          if [ "$RUNNER_OS" = macOS ]; then export PATH="/bin:$PATH"; fi  # use the stock bash 3.2
          bash --version | head -1
          bash tests/run.sh
