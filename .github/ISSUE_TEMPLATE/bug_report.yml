name: Bug report
description: A skill or agent did something wrong
labels: [bug]
body:
  - type: input
    id: command
    attributes:
      label: Skill and arguments
      placeholder: /ssak-issue 12 15
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host
      options: [Claude Code, Codex]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ssak-ssak version
      placeholder: 0.10.0
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Include the error or the part of the report that was wrong.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
