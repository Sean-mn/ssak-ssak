schema_version: "1.1"
name: no-git-question
description: A question about git worktrees is not a cleanup request, so no ssak skill
execution:
  prompt: git worktree랑 브랜치는 뭐가 달라?
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: no-ssak-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ssak-'
    min: 0
    max: 0
    arm: both
