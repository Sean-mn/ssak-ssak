schema_version: "1.1"
name: orchestrate-en
execution:
  prompt: "Open a new Claude Code pane in herdr and have it fix the typos in the README."
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ssak-orchestrate"'
