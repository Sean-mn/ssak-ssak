schema_version: "1.1"
name: no-snippet-review
description: Reviewing a pasted snippet is not a PR review, so no ssak skill
execution:
  prompt: "Is there a bug in this function? def avg(xs): return sum(xs) / len(xs)"
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: no-ssak-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ssak-'
    min: 0
    max: 0
    arm: both
