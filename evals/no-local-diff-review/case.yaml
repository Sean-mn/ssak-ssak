schema_version: "1.1"
name: no-local-diff-review
description: Reviewing uncommitted local changes is not a PR review, so no ssak skill
execution:
  prompt: "내가 방금 로컬에서 고친 변경 사항 리뷰해줘. 아직 커밋도 안 했어."
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: no-ssak-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ssak-'
    min: 0
    max: 0
    arm: both
