schema_version: "1.1"
name: contrib-repo-url
description: A repo URL with no issue number still belongs to ssak-contrib (it runs --find)
execution:
  prompt: "https://github.com/dotnet/sourcelink 해당 레포 기여해보고 싶어 분석"
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: fires
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ssak-contrib"'
